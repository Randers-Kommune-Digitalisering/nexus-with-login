[pytest]
minversion = 7.0
addopts = --cov=flask/src --cov-report term-missing
pythonpath = flask/src
testpaths = flask/tests
env =
    DEBUG=False
    POD_NAME=test-pod
    CLIENT_ID=None
    CLIENT_SECRET=None
    COOKIE_SECRET=None
    NEXUS_ORDERS_API_PATH=/api/example-orders
    R:NEXUS_FORM_PROTOTYPE_PATH=patients/{patient_id}/example-prototype
    R:NEXUS_FORM_ACTION_PATH=patients/{patient_id}/example-actions
    R:NEXUS_FLAT_REFERENCES_PATH=patients/{patient_id}/example-references
    R:NEXUS_CITIZEN_PAGE_PATH=/example-citizen/{patient_id}
    R:NEXUS_ORDER_PAGE_PATH=/example-order/{patient_id}
