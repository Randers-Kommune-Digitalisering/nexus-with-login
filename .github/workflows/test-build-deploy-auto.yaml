name: Test, build and deploy

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag commit on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main ||
            { echo "Tag commit is not on main" >&2; exit 1; }

  test:
    needs: verify-main
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r flask/src/requirements.txt
          pip install -r flask/requirements-dev.txt
      - name: Check for syntax errors or undefined names
        run: | 
          flake8 flask/src flask/tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Unit tests with pytest
        run: | 
          pytest
      - name: Lint with flake8
        run: | 
          flake8 --ignore=E501,W293 flask/src flask/tests --show-source

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "DOCKER_SERVICE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log into ghcr.io
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: ./scripts/build.sh "$DOCKER_SERVICE" "${{ github.event.repository.html_url }}"
      - name: Push tagged image
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/docker-tag.sh "$DOCKER_SERVICE:latest" "$DOCKER_SERVICE:$IMAGE_TAG"
          ./scripts/docker-push.sh "$DOCKER_SERVICE:$IMAGE_TAG"

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    concurrency:
      group: nexus-login-prod
      cancel-in-progress: false
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Randers-Kommune-Digitalisering/kithosting-randers-kommune-apps
          ref: prod
          path: infrastructure
          ssh-key: ${{ secrets.AUTO_DEPLOY }}
      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Update Nexus image tag
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          file="infrastructure/nexus-login/values.yaml"
          test "$(yq e '.service.image.tag' "$file")" != 'null'
          yq e -i '.service.image.tag = strenv(IMAGE_TAG)' "$file"
      - name: Commit and push
        working-directory: infrastructure
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add -- nexus-login/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Deploy nexus-login image $IMAGE_TAG"
            git push origin HEAD:prod
          fi